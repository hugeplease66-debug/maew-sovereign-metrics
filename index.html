                      <p className="text-xs text-slate-400">{activeDomainObj.desc}</p>
                    </div>
                  </div>
                  <span className="bg-emerald-950 text-emerald-300 border border-emerald-700 text-xs px-3 py-1 rounded font-bold">
                    เปิดใช้งานปกติ
                  </span>
                </div>

                {/* Sub-modules Tabs */}
                <div className="space-y-1.5 pt-1">
                  <div className="text-[10px] text-slate-400 font-bold">ส่วนย่อยควบคุมของโดเมนนี้ (SUB-MODULE SURFACES):</div>
                  <div className="flex flex-wrap gap-2 text-xs">
                    {activeDomainObj.subModules.map((sub) => (
                      <button
                        key={sub.id}
                        onClick={() => {
                          setActiveSubModule(sub.id);
                          addTerminalLog(`[SUB-MODULE] สลับไปยังส่วนย่อย ${sub.name} (${sub.id})`);
                        }}
                        className={`px-3 py-1.5 rounded-xl border transition cursor-pointer flex items-center gap-1.5 min-h-[36px] ${
                          activeSubModule === sub.id
                            ? 'bg-cyan-950 border-cyan-500 text-cyan-200 font-bold shadow-[0_0_10px_rgba(0,240,255,0.2)]'
                            : 'bg-slate-900 hover:bg-slate-800 border-slate-800 text-slate-300'
                        }`}
                      >
                        <span>{sub.name}</span>
                        <Icon name="CornerDownRight" className="w-3 h-3 text-cyan-400" />
                      </button>
                    ))}
                  </div>
                </div>

                {/* Dedicated Ω560 Assurance Matrix Surface in Evidence Domain */}
                {activeTab === 'evidence' ? (
                  <div className="bg-[#06080e] p-4 rounded-xl border border-emerald-900/60 space-y-4">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                      <span className="text-emerald-400 font-bold text-xs flex items-center gap-2">
                        <Icon name="ShieldCheck" className="w-4 h-4 text-emerald-400" />
                        Ω560 SOVEREIGN DYNAMIC ASSURANCE MATRIX (10 DYNAMIC CHECKS)
                      </span>
                      <span className="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded font-mono">
                        COMPUTED LIVE
                      </span>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                      {assuranceMatrix.map((ac) => (
                        <div key={ac.id} className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 flex items-start gap-2.5">
                          <div className={`mt-0.5 ${ac.status ? 'text-emerald-400' : 'text-red-400'}`}>
                            <Icon name={ac.status ? "CheckCircle2" : "AlertTriangle"} className="w-4 h-4" />
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-cyan-300 font-bold font-mono text-[11px]">{ac.id}</span>
                              <span className="text-slate-200 font-bold text-[11px]">{ac.title}</span>
                            </div>
                            <p className="text-[10px] text-slate-400 mt-0.5">{ac.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="bg-[#06080e] p-4 rounded-xl border border-slate-800 space-y-3 text-xs">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                      <div className="text-cyan-300 font-bold flex items-center gap-2">
                        <Icon name="Layers" className="w-4 h-4 text-emerald-400" />
                        <span>พื้นผิวการทำงานส่วนย่อย: {activeSubModuleObj?.name}</span>
                      </div>
                      <span className="text-[9px] bg-slate-900 border border-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">
                        ID: {activeSubModuleObj?.id}
                      </span>
                    </div>
                    <p className="text-slate-400 text-[11px]">
                      ส่วนย่อย <code className="text-cyan-300">{activeSubModuleObj?.name}</code> กำลังทำงานภายใต้โดเมนการควบคุม <code className="text-emerald-400">{activeDomainObj.name}</code> (รหัส {activeDomainObj.code}) และอยู่ภายใต้การกำกับดูแลของ {CANONICAL.PDP}
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1 text-[11px]">
                      <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                        <div className="text-slate-500 text-[9px]">สถานะการแยกส่วน TENANT</div>
                        <div className="text-emerald-400 font-bold mt-0.5">{CANONICAL.TENANT_ID} Verified</div>
                      </div>
                      <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                        <div className="text-slate-500 text-[9px]">รอยตราประทับอ้างอิง</div>
                        <div className="text-amber-400 font-bold mt-0.5">{CANONICAL.HISTORICAL_SEALS.toLocaleString()} SHA-256</div>
                      </div>
                      <div className="p-3 rounded-lg bg-slate-950 border border-slate-800">
                        <div className="text-slate-500 text-[9px]">ข้อจำกัดขอบเขต</div>
                        <div className="text-purple-300 font-bold mt-0.5">{CANONICAL.NEXT_SAFE_OMEGA} Hard Stop</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Historical Omega Lineage Map */}
              <div className="bg-[#0f121d] border border-purple-900/60 rounded-2xl p-5 font-mono space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="font-bold text-purple-300 flex items-center gap-2 text-xs">
                    <Icon name="History" className="w-4 h-4 text-purple-400" /> แผนผังวิวัฒนาการสายตระกูลสถาปัตยกรรมประวัติศาสตร์ (Historical Ω Lineage Baseline)
                  </span>
                  <span className="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded">
                    CANONICAL LINEAGE PRESERVED
                  </span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-[10px]">
                  {HISTORICAL_LINEAGE.map((item) => (
                    <div key={item.range} className="p-2.5 rounded-xl bg-[#06080e] border border-slate-800 space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="text-cyan-300 font-bold">{item.range}</span>
                        <span className="text-[8px] bg-slate-900 px-1.5 py-0.5 rounded text-emerald-400 font-bold">{item.status}</span>
                      </div>
                      <p className="text-slate-400 text-[9px] truncate">{item.title}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* Policy Command Shell Router */}
              <div className="bg-[#0f121d] border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between font-mono">
                <div>
                  <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                    <div className="flex items-center space-x-2">
                      <Icon name="Terminal" className="w-4 h-4 text-purple-400" />
                      <h2 className="text-xs font-bold uppercase tracking-wider text-slate-200">เทอร์มินัลตรวจสอบนโยบายการนำทาง (Policy Command Router)</h2>
                    </div>
                    <span className="text-[9px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">ROUTER ACTIVE</span>
                  </div>
                  <div className="bg-[#06080e] border border-slate-800 rounded-xl p-3 text-[11px] text-slate-300 h-[160px] overflow-y-auto space-y-1.5 scrollbar-thin">
                    {terminalLogs.map((log, idx) => (
                      <div key={idx} className={
                        log.startsWith('>')
                          ? 'text-cyan-400 font-bold'
                          : log.includes('REJECTED')
                          ? 'text-red-400 font-bold'
                          : log.includes('NAVIGATED') || log.includes('MASTER') || log.includes('STATUS')
                          ? 'text-emerald-300 font-bold'
                          : 'text-slate-300'
                      }>
                        {log}
                      </div>
                    ))}
                    <div ref={terminalEndRef} />
                  </div>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (cmdInput.trim()) {
                    executePolicyCommand(cmdInput);
                    setCmdInput('');
                  }
                }} className="mt-3 space-y-2">
                  <div className="relative">
                    <input
                      type="text"
                      value={cmdInput}
                      onChange={(e) => setCmdInput(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-cyan-200 focus:outline-none focus:border-cyan-500 pr-10"
                      placeholder="พิมพ์คำสั่ง (status, domains, graphs, policy, evidence, hard-stop, clear, help)..."
                    />
                    <button type="submit" className="absolute right-1 top-1 bottom-1 px-3 bg-gradient-to-r from-cyan-400 to-emerald-500 hover:brightness-110 text-black font-bold rounded-lg text-xs transition cursor-pointer">
                      <Icon name="Play" className="w-3 h-3 fill-current" />
                    </button>
                  </div>
                </form>
              </div>

              {/* System Integrity & Ω742 Reconciliation Table */}
              <div className="bg-[#0f121d] border border-slate-800/80 rounded-2xl p-5 font-mono space-y-3">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-800 pb-2 gap-2">
                  <span className="font-bold text-emerald-300 flex items-center gap-2 text-xs">
                    <Icon name="GitCommit" className="w-4 h-4 text-cyan-400" /> ตารางการรับรองสิทธิ์ความถูกต้องของระบบ (System Integrity & Ω742 Reconciliation)
                  </span>
                  <div className="flex items-center gap-3">
                    <span className={`text-[10px] font-bold ${integrityAudit.verified ? "text-emerald-400" : "text-red-400"}`}>
                      {integrityAudit.verified ? "● CANONICAL INTEGRITY VERIFIED" : "● CANONICAL INTEGRITY FAILURE"}
                    </span>
                    <button
                      onClick={handleExportAttestation}
                      className="text-[10px] bg-emerald-950 hover:bg-emerald-900 border border-emerald-700 text-emerald-300 px-2.5 py-1 rounded cursor-pointer transition font-bold"
                    >
                      ส่งออกใบรับรอง (.JSON)
                    </button>
                  </div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                  {[
                    ["13 CANONICAL DOMAINS", integrityAudit.domainsPass],
                    ["10 OPERATIONAL GRAPHS", integrityAudit.graphsPass],
                    ["Ω560 ASSURANCE MATRIX", assuranceMatrix.every(a => a.status)],
                    ["BASELINE FROZEN v1.2", integrityAudit.baselinePass],
                    ["CONTROL PLANE v2.1", integrityAudit.controlPlanePass],
                    ["HARD STOP Ω1011", integrityAudit.hardStopPass],
                  ].map(([label, passed]) => (
                    <div key={label} className="p-3 rounded-xl bg-[#06080e] border border-slate-800 text-center">
                      <div className="text-[9px] text-slate-500 truncate">{label}</div>
                      <div className={`mt-1 text-xs font-black ${passed ? 'text-emerald-400' : 'text-red-400'}`}>
                        {passed ? 'PASS ✓' : 'FAIL ✕'}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </main>

            <footer className="bg-[#0f121d] border-t border-slate-800 py-4 text-center text-xs text-slate-500 font-mono">
              {CANONICAL.PLATFORM} {CANONICAL.BASELINE} &bull; CONTROL PLANE {CANONICAL.CONTROL_PLANE} &bull; Architect: {CANONICAL.ARCHITECT}
            </footer>
          </div>

          {/* Universal Discovery Router Modal (⌘K) */}
          {isSearchOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-start justify-center pt-20 p-4 font-mono">
              <div className="bg-[#0f121d] border border-cyan-600/80 w-full max-w-xl rounded-2xl p-4 shadow-[0_0_50px_rgba(0,240,255,0.25)] space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div className="flex items-center space-x-2 text-cyan-400">
                    <Icon name="Search" className="w-4 h-4" />
                    <span className="font-bold text-xs uppercase">Universal Discovery Router</span>
                  </div>
                  <button onClick={() => setIsSearchOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                </div>
                <input
                  type="text"
                  autoFocus
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="ค้นหา Domains, Sub-modules, Graphs G01–G10 หรือ Lineage Ω..."
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-cyan-200 focus:outline-none focus:border-cyan-500"
                />
                <div className="max-h-60 overflow-y-auto space-y-1.5 pt-1 scrollbar-thin">
                  {searchResults.length === 0 ? (
                    <div className="text-center py-6 text-xs text-slate-500">ไม่พบรายการที่ตรงกับข้อความค้นหา</div>
                  ) : (
                    searchResults.map(item => (
                      <div
                        key={`${item.type}-${item.id}`}
                        onClick={() => handleSearchNavigation(item)}
                        className="bg-[#06080e] hover:bg-slate-800/80 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between cursor-pointer transition min-h-[44px]"
                      >
                        <div>
                          <div className="text-xs font-bold text-slate-200">{item.code ? `[${item.code}] ` : ''}{item.name}</div>
                          <div className="text-[10px] text-slate-400">{item.description}</div>
                        </div>
                        <span className="text-[9px] bg-slate-900 border border-slate-700 text-cyan-300 px-2 py-0.5 rounded font-bold shrink-0">
                          {item.type}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
